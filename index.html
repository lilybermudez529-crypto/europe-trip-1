<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer 2027 Expedition</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #fdfaf5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .card {
      background: #fdfaf5;
      padding: 30px 20px;
      border-radius: 15px;
      border: 1px solid #e0d7c6;
      color: #4a4238;
      max-width: 960px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    .card-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .card-header h2 {
      margin: 0;
      color: #2c3e50;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 22px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: #bc9c6c;
      margin: 10px auto;
    }

    .card-header p {
      color: #7f8c8d;
      font-size: 14px;
    }

    #map {
      width: 100%;
      height: 520px;
      border-radius: 12px;
      border: 1px solid #d1e1e8;
      z-index: 0;
    }

    .card-footer {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #7f8c8d;
    }

    /* Custom popup styling */
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    .leaflet-popup-content b {
      color: #2c3e50;
      font-size: 14px;
    }

    .stop-label {
      font-size: 11px;
      font-weight: 600;
      color: #2c3e50;
      white-space: nowrap;
    }

    /* Animated dot */
    .traveling-dot {
      width: 12px;
      height: 12px;
      background: #d81b60;
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(216, 27, 96, 0.7);
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="card-header">
      <h2>Summer 2027 Expedition</h2>
      <div class="divider"></div>
      <p>May 1st — August 1st, 2027</p>
    </div>

    <div id="map"></div>

    <div class="card-footer">
      <span>🏁 Depart: May 1, 2027</span>
      <span>✈️ Trans-Atlantic: ~July 4</span>
      <span>🇲🇽 End: Aug 1, 2027</span>
    </div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize map centered on Europe/Atlantic
    const map = L.map('map', {
      center: [47, -10],
      zoom: 4,
      zoomControl: true,
      scrollWheelZoom: true
    });

    // OpenStreetMap tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 18
    }).addTo(map);

    // --- Stop definitions ---
    const stops = [
      {
        latlng: [38.72, -9.14],
        color: '#27ae60',
        pulse: false,
        label: 'May 1: Start',
        popup: '<b>May 1: Lisbon &amp; Porto</b><br>Fresh seafood and Fado music to kick off 2027.'
      },
      {
        latlng: [37.39, -5.99],
        color: '#f39c12',
        pulse: false,
        label: 'Early May: Spain',
        popup: '<b>Early May: Spain</b><br>Seville, Jaén, and the rugged coast of Galicia &amp; Asturias.'
      },
      {
        latlng: [42.51, 1.52],
        color: '#e67e22',
        pulse: false,
        label: 'Mid May: Pyrenees',
        popup: '<b>Mid May: The Pyrenees</b><br>Through Andorra into the wine estates of Bordeaux.'
      },
      {
        latlng: [48.86, 2.35],
        color: '#d81b60',
        pulse: true,
        label: '💍 May 29: Paris',
        popup: '<b>💍 May 29: Paris</b><br>Anniversary #1. Deep museum dive (Louvre/Orsay).'
      },
      {
        latlng: [45.75, 4.83],
        color: '#8e44ad',
        pulse: false,
        label: 'Early June: SE France',
        popup: '<b>Early June: SE France</b><br>Gastronomy in Lyon and the luxury of Monaco.'
      },
      {
        latlng: [46.20, 6.15],
        color: '#2980b9',
        pulse: true,
        label: '🥂 June 10: Switzerland',
        popup: '<b>🥂 June 10: Switzerland</b><br>Anniversary #2. Mont Blanc views &amp; Geneva lakeside.'
      },
      {
        latlng: [48.21, 16.37],
        color: '#16a085',
        pulse: false,
        label: 'Mid June: Central Europe',
        popup: '<b>Mid June: Central Europe</b><br>Austria, Hungary, Czechia, and Germany.'
      },
      {
        latlng: [52.37, 4.90],
        color: '#c0392b',
        pulse: false,
        label: 'Late June: Benelux',
        popup: '<b>Late June: Benelux</b><br>Amsterdam canals &amp; Belgian chocolate.'
      },
      {
        latlng: [55.95, -3.19],
        color: '#34495e',
        pulse: false,
        label: 'July 1: UK / Scotland',
        popup: '<b>July 1: UK</b><br>London highlights and a road trip through the Scottish Highlands.'
      },
      {
        latlng: [28.63, -106.09],
        color: '#c0392b',
        pulse: true,
        label: '🎂 July 6: Chihuahua',
        popup: '<b>🎂 July 6: Chihuahua</b><br>The Grand Birthday. Tacos, history, and the Chepe Train journey.'
      }
    ];

    // Route coordinates for the polyline + animated dot
    const routeCoords = stops.map(s => s.latlng);

    // Draw dashed route line
    L.polyline(routeCoords, {
      color: '#bc9c6c',
      weight: 3,
      dashArray: '10, 6',
      lineJoin: 'round'
    }).addTo(map);

    // Draw stop markers
    stops.forEach(stop => {
      const size = stop.pulse ? 18 : 14;

      // Circle marker
      const marker = L.circleMarker(stop.latlng, {
        radius: size / 2,
        fillColor: stop.color,
        color: 'white',
        weight: 2,
        fillOpacity: 1
      }).addTo(map);

      marker.bindPopup(stop.popup, { maxWidth: 240 });

      // Pulse ring for special stops
      if (stop.pulse) {
        const pulseIcon = L.divIcon({
          className: '',
          html: `<div style="
            width: ${size + 20}px;
            height: ${size + 20}px;
            border-radius: 50%;
            border: 2px solid ${stop.color};
            opacity: 0.5;
            animation: pulse-ring 2s infinite;
            margin: -${(size + 20) / 2}px 0 0 -${(size + 20) / 2}px;
          "></div>`,
          iconSize: [0, 0]
        });
        L.marker(stop.latlng, { icon: pulseIcon, interactive: false }).addTo(map);
      }

      // Floating label
      const labelIcon = L.divIcon({
        className: 'stop-label',
        html: `<div style="
          background: rgba(255,255,255,0.85);
          padding: 2px 6px;
          border-radius: 4px;
          font-size: 11px;
          font-weight: 600;
          color: #2c3e50;
          white-space: nowrap;
          border-left: 3px solid ${stop.color};
          box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        ">${stop.label}</div>`,
        iconSize: [0, 0],
        iconAnchor: [-12, 6]
      });
      L.marker(stop.latlng, { icon: labelIcon, interactive: false }).addTo(map);
    });

    // --- Animated traveling dot ---
    const dotIcon = L.divIcon({
      className: '',
      html: '<div class="traveling-dot"></div>',
      iconSize: [12, 12],
      iconAnchor: [6, 6]
    });

    const travelingMarker = L.marker(routeCoords[0], {
      icon: dotIcon,
      interactive: false,
      zIndexOffset: 1000
    }).addTo(map);

    // Animate along segments
    let segmentIndex = 0;
    let progress = 0;
    const SPEED = 0.003; // fraction of segment per frame

    function animate() {
      if (routeCoords.length < 2) return;

      const from = routeCoords[segmentIndex];
      const to = routeCoords[(segmentIndex + 1) % routeCoords.length];

      const lat = from[0] + (to[0] - from[0]) * progress;
      const lng = from[1] + (to[1] - from[1]) * progress;
      travelingMarker.setLatLng([lat, lng]);

      progress += SPEED;
      if (progress >= 1) {
        progress = 0;
        segmentIndex = (segmentIndex + 1) % (routeCoords.length - 1);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>

  <style>
    @keyframes pulse-ring {
      0%   { transform: scale(1); opacity: 0.6; }
      70%  { transform: scale(1.8); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }
  </style>
</body>
</html>
