<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summer 2027 Expedition</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #fdfaf5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .card {
      background: #fdfaf5;
      padding: 30px 20px;
      border-radius: 15px;
      border: 1px solid #e0d7c6;
      color: #4a4238;
      max-width: 960px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.12);
    }

    .card-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .card-header h2 {
      margin: 0;
      color: #2c3e50;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 22px;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: #bc9c6c;
      margin: 10px auto;
    }

    .card-header p {
      color: #7f8c8d;
      font-size: 14px;
    }

    #map {
      width: 100%;
      height: 520px;
      border-radius: 12px;
      border: 1px solid #d1e1e8;
      z-index: 0;
    }

    .card-footer {
      margin-top: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #7f8c8d;
    }

    /* Custom popup styling */
    .leaflet-popup-content-wrapper {
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }

    .leaflet-popup-content b {
      color: #2c3e50;
      font-size: 14px;
    }

    .stop-label {
      font-size: 11px;
      font-weight: 600;
      color: #2c3e50;
      white-space: nowrap;
    }

    /* Animated dot */
    .traveling-dot {
      width: 12px;
      height: 12px;
      background: #d81b60;
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(216, 27, 96, 0.7);
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="card-header">
      <h2>Summer 2027 Expedition</h2>
      <div class="divider"></div>
      <p>May 1st — August 1st, 2027</p>
    </div>

    <div id="map"></div>

    <div class="card-footer">
      <span>🏁 Depart: May 1, 2027</span>
      <span>✈️ Trans-Atlantic: ~July 4</span>
      <span>🇲🇽 End: Aug 1, 2027</span>
    </div>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize map centered on Europe/Atlantic
    const map = L.map('map', {
      center: [48, 5],
      zoom: 4,
      zoomControl: true,
      scrollWheelZoom: true
    });

    // OpenStreetMap tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 18
    }).addTo(map);

    // --- Stop definitions ---
    const stops = [
      // ── PORTUGAL ──
      {
        latlng: [38.72, -9.14],
        color: '#1e8449',
        pulse: false,
        label: '🇵🇹 Lisbon',
        popup: '<b>🇵🇹 Lisbon — May 1: Start</b><br>Alfama district, Fado music, pastéis de nata, and the Belém Tower.'
      },
      {
        latlng: [41.15, -8.61],
        color: '#1e8449',
        pulse: false,
        label: '🇵🇹 Porto',
        popup: '<b>🇵🇹 Porto</b><br>Port wine cellars, the Douro riverfront, and Livraria Lello bookshop.'
      },
      // ── SPAIN ──
      {
        latlng: [42.88, -8.54],
        color: '#d4ac0d',
        pulse: false,
        label: '🇪🇸 Galicia',
        popup: '<b>🇪🇸 Galicia — Santiago de Compostela</b><br>End of the Camino pilgrimage route and stunning Atlantic coastline.'
      },
      {
        latlng: [43.36, -5.84],
        color: '#d4ac0d',
        pulse: false,
        label: '🇪🇸 Asturias',
        popup: '<b>🇪🇸 Asturias — Oviedo</b><br>Rugged Picos de Europa mountains and some of the freshest sidra in Spain.'
      },
      {
        latlng: [43.32, -1.98],
        color: '#d4ac0d',
        pulse: false,
        label: '🇪🇸 San Sebastián',
        popup: '<b>🇪🇸 San Sebastián</b><br>World-renowned pintxos bars and one of Europe\'s most beautiful beaches.'
      },
      {
        latlng: [42.51, 1.52],
        color: '#d4ac0d',
        pulse: false,
        label: '🇦🇩 Andorra',
        popup: '<b>🇦🇩 Andorra la Vella</b><br>Tiny mountain microstate nestled in the Pyrenees — duty-free shopping and ski runs.'
      },
      {
        latlng: [41.39, 2.15],
        color: '#d4ac0d',
        pulse: false,
        label: '🇪🇸 Barcelona',
        popup: '<b>🇪🇸 Barcelona</b><br>Gaudí\'s Sagrada Família and Park Güell, Gothic Quarter tapas, and the buzzing La Boqueria market.'
      },
      {
        latlng: [39.47, -0.38],
        color: '#d4ac0d',
        pulse: false,
        label: '🇪🇸 Valencia',
        popup: '<b>🇪🇸 Valencia</b><br>Birthplace of paella, the futuristic City of Arts and Sciences, and sunny Mediterranean beaches.'
      },
      {
        latlng: [37.77, -3.79],
        color: '#d4ac0d',
        pulse: false,
        label: '🇪🇸 Jaén',
        popup: '<b>🇪🇸 Jaén</b><br>Endless olive groves and a stunning Renaissance cathedral in the heart of Andalusia.'
      },
      {
        latlng: [40.42, -3.70],
        color: '#d4ac0d',
        pulse: false,
        label: '🇪🇸 Madrid',
        popup: '<b>🇪🇸 Madrid</b><br>The Prado and Reina Sofía museums, Retiro Park, and a legendary nightlife scene.'
      },
      {
        latlng: [37.39, -5.99],
        color: '#d4ac0d',
        pulse: false,
        label: '🇪🇸 Seville',
        popup: '<b>🇪🇸 Seville</b><br>Flamenco, the grand Alcázar palace, and unforgettable tapas in the old town.'
      },
      // ── FRANCE ──
      {
        latlng: [44.84, -0.58],
        color: '#1a5276',
        pulse: false,
        label: '🇫🇷 Bordeaux',
        popup: '<b>🇫🇷 Bordeaux</b><br>World-class wine estates, the Cité du Vin museum, and elegant 18th-century architecture.'
      },
      {
        latlng: [44.89, -0.16],
        color: '#1a5276',
        pulse: false,
        label: '🇫🇷 Saint-Émilion',
        popup: '<b>🇫🇷 Saint-Émilion</b><br>Medieval UNESCO wine village — grand cru vineyards, limestone caves, and the monolithic church carved into the rock.'
      },
      {
        latlng: [47.59, 1.33],
        color: '#1a5276',
        pulse: false,
        label: '🇫🇷 Blois',
        popup: '<b>🇫🇷 Blois</b><br>Royal Château de Blois in the heart of the Loire Valley — a mix of Gothic, Renaissance, and Classical architecture.'
      },
      {
        latlng: [47.50, 1.46],
        color: '#1a5276',
        pulse: false,
        label: '🇫🇷 Cheverny',
        popup: '<b>🇫🇷 Cheverny</b><br>One of the Loire\'s most beautifully furnished châteaux — the real-life inspiration for Moulinsart in Tintin.'
      },
      {
        latlng: [47.62, 1.52],
        color: '#1a5276',
        pulse: false,
        label: '🇫🇷 Chambord',
        popup: '<b>🇫🇷 Chambord</b><br>François I\'s Renaissance masterpiece — 440 rooms, a double-helix staircase, and sweeping forest grounds.'
      },
      {
        latlng: [47.41, 0.98],
        color: '#1a5276',
        pulse: false,
        label: '🇫🇷 Amboise',
        popup: '<b>🇫🇷 Amboise</b><br>Leonardo da Vinci\'s final home at Clos Lucé, the royal château overlooking the Loire, and a charming medieval town centre.'
      },
      {
        latlng: [47.32, 1.07],
        color: '#1a5276',
        pulse: false,
        label: '🇫🇷 Chenonceau',
        popup: '<b>🇫🇷 Château de Chenonceau</b><br>The "Ladies\' Castle" arching gracefully over the River Cher — one of France\'s most visited châteaux.'
      },
      {
        latlng: [48.86, 2.35],
        color: '#d81b60',
        pulse: true,
        label: '💍 Paris',
        popup: '<b>💍 Paris — Anniversary #1</b><br>Louvre, Musée d\'Orsay, anniversary dinner at Le Jules Verne atop the Eiffel Tower.'
      },
      {
        latlng: [45.75, 4.83],
        color: '#1a5276',
        pulse: false,
        label: '🇫🇷 Lyon',
        popup: '<b>🇫🇷 Lyon</b><br>Gastronomic capital of France — traditional bouchons, silk history, and Roman ruins.'
      },
      {
        latlng: [43.73, 7.41],
        color: '#1a5276',
        pulse: false,
        label: '🇲🇨 Monaco',
        popup: '<b>🇲🇨 Monaco</b><br>Casino de Monte-Carlo, the Formula 1 circuit, and the Prince\'s Palace perched on the Rock.'
      },
      // ── SWITZERLAND ──
      {
        latlng: [46.20, 6.15],
        color: '#2980b9',
        pulse: true,
        label: '🥂 Geneva',
        popup: '<b>🥂 Geneva — Anniversary #2</b><br>Lake Geneva promenade, the Jet d\'Eau, and world-class watchmaking heritage.'
      },
      {
        latlng: [45.92, 6.87],
        color: '#2980b9',
        pulse: false,
        label: '🇨🇭 Mont Blanc',
        popup: '<b>🇨🇭 Mont Blanc / Chamonix</b><br>Highest peak in the Alps — glacier views, the Aiguille du Midi, and mountain air.'
      },
      {
        latlng: [47.38, 8.54],
        color: '#2980b9',
        pulse: false,
        label: '🇨🇭 Zurich',
        popup: '<b>🇨🇭 Zurich</b><br>Pristine lake, old town Niederdorf quarter, and Switzerland\'s vibrant cultural scene.'
      },
      // ── AUSTRIA ──
      {
        latlng: [47.80, 13.04],
        color: '#e74c3c',
        pulse: false,
        label: '🇦🇹 Salzburg',
        popup: '<b>🇦🇹 Salzburg</b><br>Birthplace of Mozart, the Sound of Music country, and a stunning baroque old town.'
      },
      {
        latlng: [48.21, 16.37],
        color: '#e74c3c',
        pulse: false,
        label: '🇦🇹 Vienna',
        popup: '<b>🇦🇹 Vienna</b><br>Habsburg palaces, Klimt at the Belvedere, Sachertorte, and grand coffeehouses.'
      },
      // ── HUNGARY ──
      {
        latlng: [47.50, 19.04],
        color: '#8e44ad',
        pulse: false,
        label: '🇭🇺 Budapest',
        popup: '<b>🇭🇺 Budapest</b><br>Parliament on the Danube, thermal baths, ruin bars in the Jewish Quarter.'
      },
      // ── CZECHIA ──
      {
        latlng: [50.08, 14.44],
        color: '#16a085',
        pulse: false,
        label: '🇨🇿 Prague',
        popup: '<b>🇨🇿 Prague</b><br>Medieval Old Town Square, the Astronomical Clock, and excellent Czech pilsner.'
      },
      // ── GERMANY ──
      {
        latlng: [52.52, 13.40],
        color: '#566573',
        pulse: false,
        label: '🇩🇪 Berlin',
        popup: '<b>🇩🇪 Berlin</b><br>The Brandenburg Gate, East Side Gallery, world-class museums on Museum Island.'
      },
      // ── NETHERLANDS ──
      {
        latlng: [52.37, 4.90],
        color: '#e67e22',
        pulse: false,
        label: '🇳🇱 Amsterdam',
        popup: '<b>🇳🇱 Amsterdam</b><br>Canal ring, the Rijksmuseum, Van Gogh Museum, and golden-age architecture.'
      },
      // ── BELGIUM ──
      {
        latlng: [50.85, 4.35],
        color: '#f39c12',
        pulse: false,
        label: '🇧🇪 Brussels',
        popup: '<b>🇧🇪 Brussels</b><br>Grand-Place, Belgian waffles, world-famous chocolate, and the Atomium.'
      },
      // ── UK ──
      {
        latlng: [51.51, -0.13],
        color: '#34495e',
        pulse: false,
        label: '🇬🇧 London',
        popup: '<b>🇬🇧 London</b><br>British Museum, Tate Modern, Borough Market, and the Tower of London.'
      },
      {
        latlng: [57.48, -4.22],
        color: '#34495e',
        pulse: false,
        label: '🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scottish Highlands',
        popup: '<b>🏴󠁧󠁢󠁳󠁣󠁴󠁿 Scottish Highlands</b><br>Glenfinnan Viaduct, Loch Ness, and the dramatic peaks of Glen Coe.'
      },
      // ── MEXICO ──
      {
        latlng: [28.63, -106.09],
        color: '#c0392b',
        pulse: true,
        label: '🎂 Chihuahua',
        popup: '<b>🎂 July 6: Chihuahua — The Grand Birthday</b><br>Traditional feast, the Chepe Express to the Copper Canyon rim.'
      }
    ];

    // Route coordinates for the polyline + animated dot
    const routeCoords = stops.map(s => s.latlng);

    // Draw dashed route line
    L.polyline(routeCoords, {
      color: '#bc9c6c',
      weight: 3,
      dashArray: '10, 6',
      lineJoin: 'round'
    }).addTo(map);

    // Draw stop markers
    stops.forEach(stop => {
      const size = stop.pulse ? 18 : 14;

      // Circle marker
      const marker = L.circleMarker(stop.latlng, {
        radius: size / 2,
        fillColor: stop.color,
        color: 'white',
        weight: 2,
        fillOpacity: 1
      }).addTo(map);

      marker.bindPopup(stop.popup, { maxWidth: 240 });

      // Pulse ring for special stops
      if (stop.pulse) {
        const pulseIcon = L.divIcon({
          className: '',
          html: `<div style="
            width: ${size + 20}px;
            height: ${size + 20}px;
            border-radius: 50%;
            border: 2px solid ${stop.color};
            opacity: 0.5;
            animation: pulse-ring 2s infinite;
            margin: -${(size + 20) / 2}px 0 0 -${(size + 20) / 2}px;
          "></div>`,
          iconSize: [0, 0]
        });
        L.marker(stop.latlng, { icon: pulseIcon, interactive: false }).addTo(map);
      }

      // Floating label
      const labelIcon = L.divIcon({
        className: 'stop-label',
        html: `<div style="
          background: rgba(255,255,255,0.85);
          padding: 2px 6px;
          border-radius: 4px;
          font-size: 11px;
          font-weight: 600;
          color: #2c3e50;
          white-space: nowrap;
          border-left: 3px solid ${stop.color};
          box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        ">${stop.label}</div>`,
        iconSize: [0, 0],
        iconAnchor: [-12, 6]
      });
      L.marker(stop.latlng, { icon: labelIcon, interactive: false }).addTo(map);
    });

    // --- Animated traveling dot ---
    const dotIcon = L.divIcon({
      className: '',
      html: '<div class="traveling-dot"></div>',
      iconSize: [12, 12],
      iconAnchor: [6, 6]
    });

    const travelingMarker = L.marker(routeCoords[0], {
      icon: dotIcon,
      interactive: false,
      zIndexOffset: 1000
    }).addTo(map);

    // Animate along segments
    let segmentIndex = 0;
    let progress = 0;
    const SPEED = 0.003; // fraction of segment per frame

    function animate() {
      if (routeCoords.length < 2) return;

      const from = routeCoords[segmentIndex];
      const to = routeCoords[(segmentIndex + 1) % routeCoords.length];

      const lat = from[0] + (to[0] - from[0]) * progress;
      const lng = from[1] + (to[1] - from[1]) * progress;
      travelingMarker.setLatLng([lat, lng]);

      progress += SPEED;
      if (progress >= 1) {
        progress = 0;
        segmentIndex = (segmentIndex + 1) % (routeCoords.length - 1);
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>

  <style>
    @keyframes pulse-ring {
      0%   { transform: scale(1); opacity: 0.6; }
      70%  { transform: scale(1.8); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }
  </style>
</body>
</html>
